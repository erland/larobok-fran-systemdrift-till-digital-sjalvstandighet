name: Build Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.1.11.1"
      - name: Install XeLaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern fonts-texgyre poppler-utils python3-cairosvg
          fc-cache -f
          fc-match -f '%{family}\n' 'TeX Gyre Pagella' | grep -Eiq 'TeX ?Gyre ?Pagella'
      - name: Verify SVG conversion dependency
        run: python3 -c 'import cairosvg; print("CairoSVG", cairosvg.__version__)'
      - name: Verify PDF font files
        run: |
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from export_book import find_font_dir; fontdir = find_font_dir(); assert fontdir, "TeX Gyre Pagella OpenType fonts missing"; print("PDF font files:", fontdir)'
      - name: Build EPUB and PDF
        run: python3 scripts/build_book.py --output-dir "${RUNNER_TEMP}/book-dist"
      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-preview
          path: |
            ${{ runner.temp }}/book-dist/*.epub
            ${{ runner.temp }}/book-dist/*.pdf
            ${{ runner.temp }}/book-dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
