name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.1.11.1"
      - name: Install XeLaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern fonts-texgyre poppler-utils python3-cairosvg
          fc-cache -f
          # TeX Live may install TeX Gyre fonts outside /usr/share/fonts.
          # Verify the resolved font family instead of assuming a filesystem location.
          fc-match -f '%{family}\n' 'TeX Gyre Pagella' | grep -Eiq 'TeX ?Gyre ?Pagella'
      - name: Validate release tag
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Taggen måste vara v<SemVer>" >&2; exit 1; }
      - name: Verify SVG conversion dependency
        run: python3 -c 'import cairosvg; print("CairoSVG", cairosvg.__version__)'
      - name: Verify PDF font files
        run: |
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from export_book import find_font_dir; fontdir = find_font_dir(); assert fontdir, "TeX Gyre Pagella OpenType fonts missing"; print("PDF font files:", fontdir)'
      - name: Build EPUB and PDF
        env:
          BOOK_RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/build_book.py --output-dir "${RUNNER_TEMP}/book-dist"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${RUNNER_TEMP}"/book-dist/*.epub "${RUNNER_TEMP}"/book-dist/*.pdf "${RUNNER_TEMP}"/book-dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" "${RUNNER_TEMP}"/book-dist/*.epub "${RUNNER_TEMP}"/book-dist/*.pdf "${RUNNER_TEMP}"/book-dist/SHA256SUMS.txt --title "$tag" --generate-notes
          fi
