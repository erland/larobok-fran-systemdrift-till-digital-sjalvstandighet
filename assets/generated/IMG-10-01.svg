<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">IMG-10-01 IT-avdelningens dubbla uppgift</title>
<desc id="svgdesc">En gemensam styrningsnivå ramar in två utvecklingsvägar: professionell utveckling och verksamhetsnära utveckling. Båda använder gemensamma plattformsförmågor och båda behöver ett tydligt ägarskap för IT-stöd i produktion. Pilarna visar samverkan, inte rapporteringsvägar.</desc>
