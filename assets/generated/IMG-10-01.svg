<text x="48" y="48" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#172f4a">IMG-10-01 · IT-avdelningens framtida uppgift</text>
<text x="48" y="82" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#526a80">Gemensamma ramar – två utvecklingsvägar – delade förmågor – tydligt tjänsteägarskap</text>
